<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body data-page="{{.Page}}"><header><p class="eyebrow">音乐 · 记录 · 同好</p><h1>{{.Title}}</h1><p>非官方粉丝站，试听与图片均为自产演示素材。</p><nav><a href="/">首页</a><a href="/music">试听</a><a href="/albums">相册</a><a href="/login">登录</a><a href="/register">注册</a><a href="/profile">资料</a><a href="/admin">管理</a></nav><button id="logout" type="button" hidden>退出</button></header><main><p id="notice" role="status" aria-live="polite"></p>
<section data-section="home"><h2>欢迎来到音乐小站</h2><p>{{.Intro}}</p><p>这里记录共同的喜爱。请只上传自己制作或有权使用的素材。</p></section>
<section data-section="music" hidden><h2>试听音乐</h2><div id="tracks"></div></section>
<section data-section="albums" hidden><h2>影像相册</h2><div id="albums"></div><div id="album-detail"></div></section>
<section data-section="register" hidden><h2>加入同好</h2><form id="register-form" action="/api/register" method="post"><label>邮箱<input name="Email" type="email" required autocomplete="email"></label><label>密码（12–72字节）<input name="Password" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label><label>昵称<input name="Name" maxlength="80" required></label><button>注册</button></form></section>
<section data-section="login" hidden><h2>欢迎回来</h2><form id="login-form" action="/api/login" method="post"><label>邮箱<input name="Email" type="email" required autocomplete="email"></label><label>密码<input name="Password" type="password" required autocomplete="current-password"></label><button>登录</button></form></section>
<section data-section="profile" hidden><h2>个人资料</h2><form id="profile-form" action="/api/me" method="post"><label>昵称<input name="Name" maxlength="80" required></label><label>简介<textarea name="Bio" maxlength="1000"></textarea></label><button>保存我的资料</button></form></section>
<section data-section="admin" hidden><h2>站点管理</h2><form id="site-form" action="/api/admin/site" method="post"><label>站点标题<input name="Title" maxlength="160" required></label><label>介绍<textarea name="Intro" maxlength="4000"></textarea></label><button>保存站点</button></form>
<h3>音乐编辑</h3><form id="track-form" action="/api/admin/tracks" method="post"><input name="ID" type="hidden"><label>标题<input name="Title" maxlength="200" required></label><label><input name="Published" type="checkbox">发布</label><label>自产PCM WAV（最多1MiB，编辑可保留原音频）<input name="Audio" type="file" accept="audio/wav"></label><button>保存音乐</button><button type="reset">新建</button></form><div id="admin-tracks"></div>
<h3>相册编辑</h3><form id="album-form" action="/api/admin/albums" method="post"><input name="ID" type="hidden"><label>标题<input name="Title" maxlength="200" required></label><label>描述<textarea name="Description" maxlength="2000"></textarea></label><label><input name="Published" type="checkbox">发布</label><button>保存相册</button><button type="reset">新建</button></form><div id="admin-albums"></div>
<h3>添加照片</h3><form id="photo-form" action="/api/admin/photos" method="post"><label>相册<select name="Album" id="photo-album" required></select></label><label>说明<input name="Caption" maxlength="500"></label><label>自产PNG/JPEG（最多1MiB）<input name="Data" type="file" accept="image/png,image/jpeg" required></label><button>添加照片</button></form><div id="admin-photos"></div><h3>账户状态</h3><div id="admin-users"></div></section>
</main><footer>以喜爱相连 · 非官方 · 本地演示</footer></body></html>
