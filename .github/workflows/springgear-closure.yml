name: springgear-closure
on:
  push:
    branches: [verify/admin-springgear-closure-v1]
    paths: [.github/workflows/springgear-closure.yml]
permissions:
  contents: read
concurrency:
  group: springgear-closure
  cancel-in-progress: false
jobs:
  real-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SDLC_SOURCE_SHA: 5578cd109f57f69be72775b462223e3a1bc429a8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ousui/sdlc-ai-spec
          ref: 5578cd109f57f69be72775b462223e3a1bc429a8
          fetch-depth: 0
          path: _spec
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ousui/springgear
          ref: e855096ff19dcdb303dc4250ba19c30acd743ac7
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select existing JDK21 and prepare allowed local containment
        shell: bash
        run: |
          set -euo pipefail
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/springgear-evidence" "$RUNNER_TEMP/springgear-tools"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/springgear-tools"
            apt-get download bubblewrap
            for package in bubblewrap_*.deb; do dpkg-deb -x "$package" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Preserve authored inputs and prepare Maven cache before runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_springgear.py --upstream _upstream --out "$RUNNER_TEMP/springgear-inputs"
          { java -version; mvn -version; python3 --version; bwrap --version; } > "$RUNNER_TEMP/springgear-evidence/environment.txt" 2>&1
          (cd "$RUNNER_TEMP/springgear-inputs/candidate" && mvn -B -ntp verify) 2>&1 | tee "$RUNNER_TEMP/springgear-evidence/dependency-preparation.log"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os,shutil
          p=Path(os.environ['RUNNER_TEMP'])/'springgear-inputs'
          for target in (p/'candidate').rglob('target'):
              if target.is_dir():shutil.rmtree(target)
          expected=json.loads((p/'candidate-files.json').read_text())
          actual={q.relative_to(p/'candidate').as_posix():hashlib.sha256(q.read_bytes()).hexdigest() for q in (p/'candidate').rglob('*') if q.is_file()}
          assert actual==expected,'Preparation changed authored input bytes'
          PY
          tar -czf "$RUNNER_TEMP/springgear-evidence/authored-inputs.tar.gz" -C "$RUNNER_TEMP" springgear-inputs
      - name: Freeze exact runtime and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _spec rev-parse HEAD)" = "$SDLC_SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/springgear-evidence/test-source.sha"
          git -C _spec rev-parse HEAD > "$RUNNER_TEMP/springgear-evidence/runtime-source.sha"
          git -C _upstream rev-parse HEAD > "$RUNNER_TEMP/springgear-evidence/upstream-source.sha"
          git -C _spec bundle create "$RUNNER_TEMP/springgear-evidence/runtime-source.bundle" HEAD
          git archive HEAD | gzip -n > "$RUNNER_TEMP/springgear-evidence/test-source.tar.gz"
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,hashlib,json
          source=Path('_spec');runtime=Path(os.environ['RUNNER_TEMP'])/'springgear-runtime'
          for name in ('skills','packages','scripts'):
              shutil.copytree(source/name,runtime/name,ignore=shutil.ignore_patterns('__pycache__','*.pyc','AGENTS.md'))
          assert not (runtime/'docs').exists() and not (runtime/'tests').exists()
          rows={p.relative_to(runtime).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in runtime.rglob('*') if p.is_file()}
          (Path(os.environ['RUNNER_TEMP'])/'springgear-evidence/runtime-files.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          PY
      - name: Execute actual JDK21 requirement through all phases
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/replay_springgear.py --runtime "$RUNNER_TEMP/springgear-runtime" --work "$RUNNER_TEMP/springgear-product" --output "$RUNNER_TEMP/springgear-evidence/run" --case-root "$RUNNER_TEMP/springgear-inputs" --until STATUS 2>&1 | tee "$RUNNER_TEMP/springgear-evidence/replay.log"
      - name: Preserve actual product, source delta and recovery state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/springgear-evidence"
          if test -d "$RUNNER_TEMP/springgear-product"; then
            cp -a "$RUNNER_TEMP/springgear-product/source" "$RUNNER_TEMP/springgear-evidence/product-source"
            git -C "$RUNNER_TEMP/springgear-product" diff > "$RUNNER_TEMP/springgear-evidence/product.patch"
            tar -czf "$RUNNER_TEMP/springgear-evidence/recovery.tar.gz" -C "$RUNNER_TEMP" springgear-product
          fi
          cp scripts/replay_springgear.py scripts/scenario_io.py scripts/review_artifact.py scripts/close_release.py "$RUNNER_TEMP/springgear-evidence/"
          git -C _spec diff --exit-code
          git -C _upstream diff --exit-code
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: springgear-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/springgear-evidence/
          if-no-files-found: error
          retention-days: 30
