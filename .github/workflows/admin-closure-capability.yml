name: admin-closure-capability
on:
  push:
    branches: [verify/web-realflow-v1]
    paths: [.github/workflows/admin-closure-capability.yml]
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify available OS containment without sudo or system changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capability/evidence" "$RUNNER_TEMP/capability/tools"
          cd "$RUNNER_TEMP/capability/tools"
          if ! command -v bwrap >/dev/null; then
            apt-get download bubblewrap
            for package in bubblewrap_*.deb; do dpkg-deb -x "$package" extracted; done
            export PATH="$PWD/extracted/usr/bin:$PATH"
          fi
          bwrap --version | tee ../evidence/version.txt
          readlink /proc/self/ns/net > ../evidence/host-network.txt
          bwrap --die-with-parent --unshare-all --ro-bind / / --bind "$RUNNER_TEMP/capability" "$RUNNER_TEMP/capability" --proc /proc --dev /dev -- /usr/bin/python3 -c 'import os,socket,pathlib; print("network",os.readlink("/proc/self/ns/net")); p=pathlib.Path(os.environ["RUNNER_TEMP"])/"capability/evidence/inside.txt"; p.write_text("isolated local write observed\n"); s=socket.socket(); s.settimeout(1); print("external_connect_code",s.connect_ex(("1.1.1.1",443))); assert s.connect_ex(("1.1.1.1",443))!=0' | tee ../evidence/probe.txt
          tar -czf ../evidence/bubblewrap-tools.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-closure-capability-${{ github.sha }}
          path: ${{ runner.temp }}/capability/evidence/
          if-no-files-found: error
          retention-days: 30
