name: retarget-final-integration-verification
on:
  push:
    branches: [verify/integration-three-project-20260907]
    paths: [.github/workflows/retarget-final-verification.yml]
permissions:
  contents: write
jobs:
  retarget:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind final workflow to exact integration SHA and remove one-time transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = verify/integration-three-project-20260907
          file=.github/workflows/integration-final-verification.yml
          test "$(grep -c 'SDLC_SOURCE_SHA: 327d256d0ed45ec65f2cb0409e8c04419863d77a' "$file")" = 1
          sed -i 's/SDLC_SOURCE_SHA: 327d256d0ed45ec65f2cb0409e8c04419863d77a/SDLC_SOURCE_SHA: a166d0a06dccf929ee00809985ec1e6cd2dc04f5/' "$file"
          rm .github/workflows/retarget-final-verification.yml
          git add "$file" .github/workflows/retarget-final-verification.yml
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/verify/integration-three-project-20260907 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: bind final verification to integration a166d0a'
          git push origin HEAD:refs/heads/verify/integration-three-project-20260907
