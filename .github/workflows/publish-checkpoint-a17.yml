name: publish-checkpoint-a17
on:
  push:
    branches: [verify/web-realflow-26-20260907-a17]
    paths: ['checkpoints/a17/**']
permissions:
  contents: read
concurrency:
  group: checkpoint-a17
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize checked archive into readable files
        run: python3 scripts/publish_checkpoint_a17.py
      - name: Commit only this execution's published files
        shell: bash
        run: |
          set -euo pipefail
          branch=verify/web-realflow-26-20260907-a17
          test "$GITHUB_REF_NAME" = "$branch"
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git add -- cases runs
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(checkpoint-a17): materialize exact source and evidence files'
          git push origin "HEAD:refs/heads/$branch"
