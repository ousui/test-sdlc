name: admin-closure
on:
  push:
    branches: [verify/admin-springgear-closure-v1]
    paths: [.github/workflows/admin-closure.yml]
permissions:
  contents: read
concurrency:
  group: admin-closure
  cancel-in-progress: false
jobs:
  real-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SDLC_SOURCE_SHA: 5578cd109f57f69be72775b462223e3a1bc429a8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ousui/sdlc-ai-spec
          ref: 5578cd109f57f69be72775b462223e3a1bc429a8
          fetch-depth: 0
          path: _spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare dependencies and supported OS containment outside runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-evidence" "$RUNNER_TEMP/admin-tools"
          python3 -m venv "$RUNNER_TEMP/admin-env"
          "$RUNNER_TEMP/admin-env/bin/pip" install -r cases/admin/requirements.lock
          echo "$RUNNER_TEMP/admin-env/bin" >> "$GITHUB_PATH"
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/admin-tools"
            apt-get download bubblewrap
            for package in bubblewrap_*.deb; do dpkg-deb -x "$package" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Freeze runtime resources and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _spec rev-parse HEAD)" = "$SDLC_SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/admin-evidence/test-source.sha"
          git -C _spec rev-parse HEAD > "$RUNNER_TEMP/admin-evidence/runtime-source.sha"
          git -C _spec bundle create "$RUNNER_TEMP/admin-evidence/runtime-source.bundle" HEAD
          git archive HEAD | gzip -n > "$RUNNER_TEMP/admin-evidence/test-source.tar.gz"
          python - <<'PY'
          from pathlib import Path
          import os,shutil,hashlib,json
          source=Path('_spec');runtime=Path(os.environ['RUNNER_TEMP'])/'admin-runtime'
          for name in ('skills','packages','scripts'):
              shutil.copytree(source/name,runtime/name,ignore=shutil.ignore_patterns('__pycache__','*.pyc','AGENTS.md'))
          assert not (runtime/'docs').exists() and not (runtime/'tests').exists()
          rows={p.relative_to(runtime).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in runtime.rglob('*') if p.is_file()}
          (Path(os.environ['RUNNER_TEMP'])/'admin-evidence/runtime-files.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          PY
          { python --version; bwrap --version; } > "$RUNNER_TEMP/admin-evidence/environment.txt" 2>&1
      - name: Execute authored requirement through CTX REQ DSN PLN IMP VFY RLS Status
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/replay_admin.py --runtime "$RUNNER_TEMP/admin-runtime" --work "$RUNNER_TEMP/admin-product" --output "$RUNNER_TEMP/admin-evidence/run" --until STATUS --exercise-design-revision 2>&1 | tee "$RUNNER_TEMP/admin-evidence/replay.log"
      - name: Retain actual product and recoverable synthetic state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-evidence"
          if test -d "$RUNNER_TEMP/admin-product"; then
            cp -a "$RUNNER_TEMP/admin-product/source" "$RUNNER_TEMP/admin-evidence/product-source"
            tar -czf "$RUNNER_TEMP/admin-evidence/recovery.tar.gz" -C "$RUNNER_TEMP" admin-product
          fi
          cp scripts/replay_admin.py scripts/review_artifact.py scripts/close_release.py "$RUNNER_TEMP/admin-evidence/"
          git -C _spec diff --exit-code
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admin-evidence/
          if-no-files-found: error
          retention-days: 30
  publish-readable-evidence:
    needs: real-lifecycle
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: admin-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: _evidence
      - name: Validate actual terminal evidence before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_admin.py --evidence _evidence --destination runs --run-id "$GITHUB_RUN_ID" --runtime-sha 5578cd109f57f69be72775b462223e3a1bc429a8
          test "$GITHUB_REF_NAME" = verify/admin-springgear-closure-v1
          test "$(git ls-remote origin refs/heads/verify/admin-springgear-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git add -- "runs/ADMIN-$GITHUB_RUN_ID"
          git diff --cached --check -- "runs/ADMIN-$GITHUB_RUN_ID/source" "runs/ADMIN-$GITHUB_RUN_ID/README.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test(admin): archive verified lifecycle from run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/verify/admin-springgear-closure-v1
