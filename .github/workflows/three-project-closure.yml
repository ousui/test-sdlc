name: three-project-closure
on:
  push:
    branches: [verify/fansite-closure-v1]
    paths: [.github/workflows/three-project-closure.yml, scripts/archive_three_project_closure.py]
permissions:
  contents: read
  actions: read
concurrency:
  group: three-project-closure
  cancel-in-progress: false
jobs:
  verify-and-archive-completed-executions:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ousui/sdlc-ai-spec
          ref: eff4ac209fe4cc1d0fefcd7e4478cb5b9f786af4
          fetch-depth: 0
          path: _runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 849783ddbc9b2ffd5300e3b1582049a390a2e2a8
          path: _validators
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable original ZIPs and verify producing jobs and digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,os,stat,subprocess,zipfile
          root=Path(os.environ['RUNNER_TEMP']);package=root/'closure';raw=package/'original-zips';metadata=package/'metadata'
          raw.mkdir(parents=True);metadata.mkdir()
          rows=[
            ('strict',10021750738,34129304795,'849783ddbc9b2ffd5300e3b1582049a390a2e2a8','strict-runtime','b2d6c36fcedb065999487ef6ea3eae7ac4714cdc04d6a00eb0fa53548d2384bb'),
            ('admin',10021433778,34129304795,'849783ddbc9b2ffd5300e3b1582049a390a2e2a8','real-project (admin)','a1a7cf886c83eb4ab7a843c138e9369af26d7bb19e4dfffce2a159b65bbde3b6'),
            ('fansite',10021454030,34129304795,'849783ddbc9b2ffd5300e3b1582049a390a2e2a8','real-project (fansite)','b53e43882f1705d311d96800bd20f29308c65bafcfca5046d282775c9abd31bc'),
            ('springgear',10021569139,34129631361,'a74f1d24c38616ea18a81e6ab0c345d26ed4b14a','real-lifecycle','b2f1cecc1eb489ab5eeb2a39fe531ad5b083d86adfdbd9205274fddf11893669')]
          curl=['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--max-time','90','-H','Authorization: Bearer '+os.environ['GH_TOKEN']]
          endpoint='https://api.github.com/repos/ousui/test-sdlc/'
          def api(path):return json.loads(subprocess.check_output(curl+[endpoint+path]))
          histories={};inputs=[]
          for case,aid,rid,head,job,digest in rows:
              if rid not in histories:
                  run=api(f'actions/runs/{rid}');jobs=api(f'actions/runs/{rid}/jobs?per_page=100')
                  assert run['status']=='completed' and run['head_sha']==head and run['run_attempt']==1
                  (metadata/f'run-{rid}.json').write_text(json.dumps(run,indent=2)+'\n')
                  (metadata/f'jobs-{rid}.json').write_text(json.dumps(jobs,indent=2)+'\n')
                  histories[rid]=jobs
              match=[j for j in histories[rid]['jobs'] if j['name']==job]
              assert len(match)==1 and match[0]['status']=='completed' and match[0]['conclusion']=='success'
              info=api(f'actions/artifacts/{aid}')
              assert info['id']==aid and not info['expired'] and info['workflow_run']['id']==rid and info['workflow_run']['head_sha']==head
              assert info['digest']=='sha256:'+digest and info['size_in_bytes']<64*1024*1024
              (metadata/f'artifact-{aid}.json').write_text(json.dumps(info,indent=2)+'\n')
              archive=raw/f'{case}-{aid}.zip'
              subprocess.run(curl+[endpoint+f'actions/artifacts/{aid}/zip','-o',str(archive)],check=True)
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==digest
              out=root/'evidence'/case;out.mkdir(parents=True)
              with zipfile.ZipFile(archive) as z:
                  assert len(z.infolist())==len(set(z.namelist()))<5000
                  assert sum(f.file_size for f in z.infolist())<512*1024*1024
                  for f in z.infolist():
                      p=PurePosixPath(f.filename)
                      assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(f.external_attr>>16)
                      assert f.file_size<128*1024*1024
                  z.extractall(out)
              inputs.append({'case':case,'artifact_id':aid,'run_id':rid,'trigger_sha':head,'job':job,'sha256':digest,'original_name':info['name']})
          (metadata/'closure-inputs.json').write_text(json.dumps(inputs,indent=2)+'\n')
          print('Four exact raw ZIPs and successful producing jobs verified; no execution was replayed.')
          PY
      - name: Recompute exact-source identities and all original closure evidence without replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _validators rev-parse HEAD)" = 849783ddbc9b2ffd5300e3b1582049a390a2e2a8
          python3 -B scripts/archive_three_project_closure.py --evidence "$RUNNER_TEMP/evidence" --runtime _runtime --validators _validators --destination "$RUNNER_TEMP/closure/readable/runs" 2>&1 | tee "$RUNNER_TEMP/closure/verification.log"
          cp scripts/archive_three_project_closure.py "$RUNNER_TEMP/closure/"
          cp .github/workflows/three-project-closure.yml "$RUNNER_TEMP/closure/"
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'closure'
          (root/'README.md').write_text('# Exact three-project closure archive\n\nRuntime eff4ac209fe4cc1d0fefcd7e4478cb5b9f786af4.\n\nRead [the verified result](readable/runs/CLOSURE-eff4ac2-20260907/README.md). Original ZIPs retain source bundles, authored inputs and complete recovery state. The metadata records original failed and successful jobs without rewriting history. This archive job performed no new Skill or release effects.\n')
          manifest={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert not any(p.is_symlink() for p in root.rglob('*'))
          (root/'SHA256SUMS.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-project-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/closure/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish-archived-evidence:
    needs: verify-and-archive-completed-executions
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: three-project-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/archived
      - name: Read back complete archived bytes before publishing readable results
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path(os.environ['RUNNER_TEMP'])/'archived';manifest=json.loads((root/'SHA256SUMS.json').read_text())
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}-{'SHA256SUMS.json'}
          assert actual==set(manifest)
          for rel,digest in manifest.items():
              path=root/rel;path.resolve(strict=True).relative_to(root.resolve())
              assert not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          receipt=json.loads((root/'readable/runs/CLOSURE-eff4ac2-20260907/verification.json').read_text())
          assert receipt['status']=='PASS' and receipt['runtime_source_sha']=='eff4ac209fe4cc1d0fefcd7e4478cb5b9f786af4'
          assert receipt['new_skill_executions']==receipt['new_product_or_release_effects']==0
          for folder in (root/'readable/runs').iterdir():
              assert folder.is_dir() and not (Path('runs')/folder.name).exists()
              shutil.copytree(folder,Path('runs')/folder.name)
          closure=Path('runs/CLOSURE-eff4ac2-20260907')
          for name in ('closure-inputs.json','jobs-34129304795.json','jobs-34129631361.json'):
              shutil.copyfile(root/'metadata'/name,closure/name)
          manifest={p.relative_to(closure).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in closure.rglob('*') if p.is_file() and p.name!='SHA256SUMS.json'}
          (closure/'SHA256SUMS.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          old=Path('README.md').read_text()
          text='# SDLC 真实项目闭环验证\n\n## 2026-09-07：修复版三项目同源闭环\n\n'
          text+='准确 Runtime：`eff4ac209fe4cc1d0fefcd7e4478cb5b9f786af4`。共同测试源码：`849783ddbc9b2ffd5300e3b1582049a390a2e2a8`。\n\n'
          text+='strict **1092/1092**；Admin **13**项；SpringGear JDK21 **10**项；粉丝站 **24**项。三项目均完成正式 VFY、本地 Sandbox RLS 与最终 Status。\n\n'
          text+='[汇总与失败/续跑记录](runs/CLOSURE-eff4ac2-20260907/README.md) · [机器可核验记录](runs/CLOSURE-eff4ac2-20260907/verification.json)\n\n'
          text+=f'[完整原始归档 Actions](https://github.com/ousui/test-sdlc/actions/runs/{os.environ["GITHUB_RUN_ID"]})：包含四份原始ZIP、Runtime源码bundle、测试输入、完整恢复包、逐文件哈希及原始作业状态。归档只消费已完成证据，没有重放效果。\n\n'
          text+='本轮没有修改规范、增加Runtime项目特判、修改main/fixed/full-verify，或以旧版本PASS替代修复版通过。RLS仅为本地Sandbox，不是生产部署或原生客户端认证。最终verified引用在完整归档读回之后单独固定。\n\n'
          text+='<details><summary>历史双项目基线与早期验证记录（非本次修复版证据）</summary>\n\n'+old+'\n</details>\n'
          Path('README.md').write_text(text)
          PY
      - name: Commit only archived results with branch compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = verify/fansite-closure-v1
          test "$(git ls-remote origin refs/heads/verify/fansite-closure-v1 | cut -f1)" = "$GITHUB_SHA"
          git add -- README.md runs/ADMIN-34129304795 runs/SPRINGGEAR-34129631361 runs/FANSITE-34129304795 runs/RUNTIME-34129304795 runs/CLOSURE-eff4ac2-20260907
          # Captured upstream/evidence bytes are immutable, including historical whitespace.
          git diff --cached --check -- README.md runs/CLOSURE-eff4ac2-20260907/README.md runs/CLOSURE-eff4ac2-20260907/verification.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: archive three exact-source closures and strict 1092-case evidence' -m 'Runtime eff4ac209fe4cc1d0fefcd7e4478cb5b9f786af4; original effects retained, not replayed. The earlier mixed-result run remains failure in archived job metadata.'
          git push origin HEAD:refs/heads/verify/fansite-closure-v1
          git rev-parse HEAD
