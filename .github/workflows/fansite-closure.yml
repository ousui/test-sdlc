name: fansite-closure
on:
  push:
    branches: [verify/fansite-closure-v1]
    paths: [.github/workflows/fansite-closure.yml]
permissions:
  contents: read
concurrency:
  group: fansite-closure
  cancel-in-progress: false
jobs:
  real-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SDLC_SOURCE_SHA: 0102b8f42a87809f58f978e2c2611705b30e7869
      GOPROXY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ousui/sdlc-ai-spec
          ref: 0102b8f42a87809f58f978e2c2611705b30e7869
          fetch-depth: 0
          path: _spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing tools and prepare isolated containment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fansite-evidence" "$RUNNER_TEMP/fansite-tools"
          command -v go
          go version
          test "$(git hash-object cases/fansite/candidate/vendor/golang.org/x/crypto/pbkdf2/pbkdf2.go)" = 28cd99c7f3fc50b03f3789b1013401db46d40bf9
          python3 -m py_compile scripts/replay_fansite.py scripts/scenario_io.py scripts/review_artifact.py scripts/close_release.py
          node --check cases/fansite/candidate/web/app.js
          if ! command -v bwrap >/dev/null; then
            cd "$RUNNER_TEMP/fansite-tools"
            apt-get download bubblewrap
            for package in bubblewrap_*.deb; do dpkg-deb -x "$package" extracted; done
            echo "$PWD/extracted/usr/bin" >> "$GITHUB_PATH"
          fi
      - name: Preserve exact source provenance and docs-free runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _spec rev-parse HEAD)" = "$SDLC_SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/fansite-evidence/test-source.sha"
          git -C _spec rev-parse HEAD > "$RUNNER_TEMP/fansite-evidence/runtime-source.sha"
          git -C _spec bundle create "$RUNNER_TEMP/fansite-evidence/runtime-source.bundle" HEAD
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/fansite-evidence/test-source.tar.gz"
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,hashlib,json
          source=Path('_spec');runtime=Path(os.environ['RUNNER_TEMP'])/'fansite-runtime'
          for name in ('skills','packages','scripts'):
              shutil.copytree(source/name,runtime/name,ignore=shutil.ignore_patterns('__pycache__','*.pyc','AGENTS.md'))
          assert not (runtime/'docs').exists() and not (runtime/'tests').exists()
          rows={p.relative_to(runtime).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in runtime.rglob('*') if p.is_file()}
          (Path(os.environ['RUNNER_TEMP'])/'fansite-evidence/runtime-files.json').write_text(json.dumps(rows,sort_keys=True,indent=2))
          PY
          { python3 --version; go version; bwrap --version; node --version; } > "$RUNNER_TEMP/fansite-evidence/environment.txt" 2>&1
      - name: Execute CTX REQ DSN PLN three IMPs VFY RLS and Status
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/replay_fansite.py --runtime "$RUNNER_TEMP/fansite-runtime" --work "$RUNNER_TEMP/fansite-product" --output "$RUNNER_TEMP/fansite-evidence/run" --case-root "$GITHUB_WORKSPACE/cases/fansite" --until STATUS 2>&1 | tee "$RUNNER_TEMP/fansite-evidence/replay.log"
      - name: Retain actual source and recoverable synthetic state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fansite-evidence"
          if test -d "$RUNNER_TEMP/fansite-product"; then
            cp -a "$RUNNER_TEMP/fansite-product/source" "$RUNNER_TEMP/fansite-evidence/product-source"
            tar -czf "$RUNNER_TEMP/fansite-evidence/recovery.tar.gz" -C "$RUNNER_TEMP" fansite-product
          fi
          cp scripts/replay_fansite.py scripts/scenario_io.py scripts/review_artifact.py scripts/close_release.py "$RUNNER_TEMP/fansite-evidence/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fansite-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fansite-evidence/
          if-no-files-found: error
          retention-days: 30
